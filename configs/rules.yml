# Правила классификации Mailbridge
# Изменяйте этот файл для настройки без пересборки сервиса

rules:
  - keywords:
      - "не работает"
      - "неработает"
      - "упал"
      - "лежит"
      - "недоступен"
      - "ошибка сервер"
      - "внутренняя ошибка"
      - "502"
      - "503"
    type: bug
    priority: urgent
    weight: 5

  - keywords:
      - "ошибка"
      - "баг"
      - "некорректно"
      - "глючит"
      - "не отображается"
      - "не открывается"
      - "не загружается"
    type: bug
    priority: high
    weight: 3

  - keywords:
      - "доступ"
      - "пароль"
      - "логин"
      - "завести пользователь"
      - "права доступ"
      - "авторизация не проходит"
      - "не могу войти"
    type: access
    priority: medium
    weight: 3

  - keywords:
      - "seo"
      - "продвижение"
      - "поисковая оптимизация"
      - "яндекс метрика"
      - "метатег"
      - "поисковая выдача"
      - "семантика"
    type: seo
    priority: medium
    weight: 2

  - keywords:
      - "обновить баннер"
      - "поменять текст"
      - "добавить новость"
      - "акция"
      - "обновить информацию"
      - "заменить фото"
      - "добавить страницу"
    type: content
    priority: low
    weight: 2

  - keywords:
      - "консультация"
      - "вопрос"
      - "как сделать"
      - "объясните"
      - "помогите"
      - "подскажите"
    type: support
    priority: medium
    weight: 1

  # Проекты
  - keywords: ["трк", "арендатор", "торговый комплекс", "кабинет арендатора"]
    project: "ТРК"
    weight: 2

  - keywords: ["отель", "гостиница", "номер", "бронирование"]
    project: "Отель"
    weight: 2

  - keywords: ["фитнес", "клуб", "тренажерный зал"]
    project: "Фитнес-клуб"
    weight: 2

  - keywords: ["театр", "билет", "спектакль", "yoomoney"]
    project: "Театр"
    weight: 2

  - keywords: ["мебель", "мебельный центр", "маркетплейс"]
    project: "Мебельный центр"
    weight: 2

  - keywords: ["склад", "складской комплекс"]
    project: "Складской комплекс"
    weight: 2

  - keywords: ["кафе", "ресторан", "меню"]
    project: "Кафе"
    weight: 2

  - keywords: ["арена", "каток", "расписание лед"]
    project: "Ледовая арена"
    weight: 2

  - keywords: ["визитка", "корпоративный сайт", "публичный документ"]
    project: "Корпоративные сайты"
    weight: 2

# Срочные паттерны
urgency_patterns:
  - "срочно"
  - "горит"
  - "упал"
  - "не работает совсем"
  - "клиент жалуется"
  - "потеря денег"
  - "прямо сейчас"
  - "asap"
  - "urgent"
  - "critical"
  - "всё сломалось"
  - "ничего не работает"
  - "пожар"
  - "аврал"

# Допустимые типы задач
valid_types:
  - bug
  - feature
  - support
  - access
  - seo
  - content

# Допустимые приоритеты
valid_priorities:
  - urgent
  - high
  - medium
  - low