name: CI

# Доки (md/docs/archive) — без прогона CI: там нечему ломать, а npm/go-джобы — 2–4 мин
# на каждый doc-only PR. Любой PR с кодом (go/vue/Makefile) CI запускает в полном виде.
on:
  push:
    branches: [main, develop, feature/ai]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "archive/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "archive/**"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test
          npm run build
          cd ..
          mkdir -p cmd/mailbridge/static
          cp -r frontend/dist/* cmd/mailbridge/static/

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          mkdir -p cmd/mailbridge/static
          cp -r frontend/dist/* cmd/mailbridge/static/

      - name: Run tests
        run: go test -v -count=1 -race ./...