name: CI

on:
  push:
    branches: [main, develop, feature/ai]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build
          cd ..
          mkdir -p cmd/mailbridge/static
          cp -r frontend/dist/* cmd/mailbridge/static/

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          mkdir -p cmd/mailbridge/static
          cp -r frontend/dist/* cmd/mailbridge/static/

      - name: Run tests
        run: go test -v -count=1 -race ./...