name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # полная история для git describe (версия в бинарнике)
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Build (frontend + static + binary)
        run: make build

      - name: Version check (вшитая версия == тег)
        run: |
          OUT="$(./build/mailbridge version)"
          echo "$OUT"
          # вшитая версия должна совпадать с пуш-тегом (без префикса v)
          EXPECTED="${GITHUB_REF_NAME#v}"
          echo "$OUT" | grep -q "$EXPECTED" || { echo "MISMATCH: expected $EXPECTED in '$OUT'"; exit 1; }

      - name: Create GitHub Release + binary
        # gh CLI на runner'е использует GITHUB_TOKEN автоматически
        run: |
          gh release create "${GITHUB_REF_NAME}" build/mailbridge \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
