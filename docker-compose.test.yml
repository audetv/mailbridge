services:
  greenmail:
    image: greenmail/standalone:2.1.1
    container_name: mailbridge-greenmail
    ports:
      - "3025:3025"   # SMTP
      - "3110:3110"   # POP3
      - "3143:3143"   # IMAP
      - "3465:3465"   # SMTPS
      - "3993:3993"   # IMAPS
      - "8081:8080"   # API
    environment:
      - GREENMAIL_OPTS=-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/user/test@localhost"]
      interval: 2s
      timeout: 5s
      retries: 10